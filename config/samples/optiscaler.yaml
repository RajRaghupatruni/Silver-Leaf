apiVersion: optiscale.silver-leaf.io/v1alpha1
kind: OptiScaler
metadata:
  name: demo-api
  namespace: optiscale-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-api
  minReplicas: 1
  maxReplicas: 5
  metric:
    # Both services export this histogram in seconds; convert the target p95 to milliseconds.
    prometheusQuery: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="optiscale-demo",app="demo-api"}[1m]))) * 1000
    utilizationQuery: sum(avg_over_time(http_active_work{namespace="optiscale-demo",app="demo-api"}[1m]))
    utilizationThreshold: 30
    requestRateQuery: sum(rate(http_requests_total{namespace="optiscale-demo",app="demo-api"}[1m]))
    errorRequestRateQuery: sum(rate(http_errors_total{namespace="optiscale-demo",app="demo-api"}[1m]))
  slo:
    targetP95Milliseconds: 250
  policy:
    scaleUpThreshold: 250
    scaleDownThreshold: 150
    maxScaleUpStep: 1
    maxScaleDownStep: 1
    cooldownSeconds: 30
  dependencies:
    - name: inventory-service
      dependsOn: postgres
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: inventory-service
      metrics:
        latencyQuery: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="optiscale-demo",app="inventory-service"}[1m]))) * 1000
        utilizationQuery: sum(avg_over_time(http_active_work{namespace="optiscale-demo",app="inventory-service"}[1m]))
        requestRateQuery: sum(rate(http_requests_total{namespace="optiscale-demo",app="inventory-service"}[1m]))
        errorRequestRateQuery: sum(rate(http_errors_total{namespace="optiscale-demo",app="inventory-service"}[1m]))
      thresholds:
        latencyMilliseconds: 250
        utilization: 100
      scalable: true
      minReplicas: 1
      maxReplicas: 5
    - name: postgres
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: postgres
      metrics:
        latencyQuery: histogram_quantile(0.95, sum by (le) (rate(db_request_duration_seconds_bucket{namespace="optiscale-demo",app="inventory-service"}[1m]))) * 1000
        utilizationQuery: sum(avg_over_time(db_active_requests{namespace="optiscale-demo",app="inventory-service"}[1m]))
        requestRateQuery: sum(rate(db_requests_total{namespace="optiscale-demo",app="inventory-service"}[1m]))
        errorRequestRateQuery: sum(rate(db_errors_total{namespace="optiscale-demo",app="inventory-service"}[1m]))
      thresholds:
        latencyMilliseconds: 250
        utilization: 8
      scalable: false
      minReplicas: 1
      maxReplicas: 1
  prometheus:
    address: http://prometheus.optiscale-system.svc.cluster.local:9090
