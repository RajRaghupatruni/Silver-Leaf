apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: optiscale-demo
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: optiscale/inventory-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INVENTORY_WORK_MS
              value: "25"
            - name: INVENTORY_CONCURRENCY
              value: "20"
            - name: INVENTORY_DB_DELAY_MS
              value: "0"
            - name: DATABASE_HOST
              value: postgres.optiscale-demo.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: optiscale
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: optiscale-postgres
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: optiscale-postgres
                  key: password
            - name: DATABASE_MAX_OPEN_CONNS
              value: "40"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
