apiVersion: batch/v1
kind: Job
metadata:
  name: optiscale-predictable-ramp-success
  namespace: optiscale-demo
  labels:
    app: optiscale-k6
    scenario: predictable-ramp-success
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: optiscale-k6
        scenario: predictable-ramp-success
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        fsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.2.0
          imagePullPolicy: IfNotPresent
          args: ["run", "/scripts/predictable-ramp-success.js"]
          env:
            - name: TARGET_URL
              value: http://demo-api.optiscale-demo.svc.cluster.local:8080/
            - name: K6_NO_USAGE_REPORT
              value: "true"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 12345
            runAsGroup: 12345
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: optiscale-k6-script-success
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
