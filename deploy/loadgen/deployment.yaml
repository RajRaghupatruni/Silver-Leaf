apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-loadgen
  namespace: optiscale-demo
  labels:
    app: demo-loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-loadgen
  template:
    metadata:
      labels:
        app: demo-loadgen
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while [ "$i" -lt "${LOADGEN_CONCURRENCY:-40}" ]; do
                (
                  while true; do
                    curl -fsS --max-time 5 http://demo-api.optiscale-demo.svc.cluster.local:8080/ >/dev/null 2>&1 || true
                  done
                ) &
                i=$((i + 1))
              done
              wait
          env:
            - name: LOADGEN_CONCURRENCY
              value: "40"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
